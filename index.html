<body>
    <header>
        <h1>
            <span class="título1">Photo</span>
            <span class="título2">Gallery</span>
        </h1>
    </header>
    <main>
        <div class='galeria'>
            <div id="carouselExampleSlidesOnly" class="carousel slide" data-bs-ride="carousel">
                <div class="carousel-inner">
                    <div class="carousel-item conteiner1 active" data-bs-interval="1000">
                        <img src="https://contablobluizvidal.blob.core.windows.net/conteiner-blob-do-profe-lu/Azaleias.jpg"
                            class="d-block w-100" alt="...">
                    </div>
                    <div class="carousel-item conteiner1" data-bs-interval="1000">
                        <img src="https://contablobluizvidal.blob.core.windows.net/conteiner-blob-do-profe-lu/Gerbera.jpg"
                            class="d-block w-100" alt="...">
                    </div>
                    <div class="carousel-item conteiner1" data-bs-interval="1000">
                        <img src="https://contablobluizvidal.blob.core.windows.net/conteiner-blob-do-profe-lu/giornoGiovanna.png"
                            class="d-block w-100" alt="...">
                    </div>
                </div>
            </div>
        </div>
    </main>
    <a href="#" class="action">
        &#10515; Veja Mais
    </a>

</body>
